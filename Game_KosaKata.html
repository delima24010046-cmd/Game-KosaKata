<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Kosa Kata Bahasa Inggris SD</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Poppins', Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      background: #ffe66d;
      border-radius: 50%;
      top: -70px;
      left: -60px;
      opacity: 0.75;
    }

    .container::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      background: #ff8fab;
      border-radius: 50%;
      right: -60px;
      bottom: -60px;
      opacity: 0.65;
    }

    .content {
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 0 0 10px;
      color: #3b3b98;
      font-size: 34px;
    }

    .subtitle {
      margin-bottom: 22px;
      color: #555;
      font-size: 18px;
    }

    .cover-page {
      background: linear-gradient(135deg, #fff4c2, #d0ebff);
      padding: 45px 25px;
      border-radius: 28px;
      border: 4px dashed #4dabf7;
    }

    .cover-icon {
      font-size: 90px;
    }

    .cover-title {
      font-size: 42px;
      margin-top: 10px;
      line-height: 1.25;
    }

    .teacher-label {
      font-size: 22px;
      color: #555;
      margin-top: 18px;
      font-weight: bold;
    }

    .teacher-names {
      font-size: 24px;
      color: #3b3b98;
      font-weight: bold;
      line-height: 1.8;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .badge {
      background: #f1f5ff;
      border: 3px solid #dbe5ff;
      color: #334;
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: bold;
    }

    .question-box {
      background: linear-gradient(135deg, #fff4c2, #ffe5ec);
      border: 4px dashed #ffbe0b;
      border-radius: 24px;
      padding: 25px 18px;
      margin: 16px 0 22px;
    }

    .emoji {
      font-size: 62px;
      margin-bottom: 10px;
    }

    .question {
      font-size: 26px;
      color: #222;
      font-weight: bold;
      line-height: 1.4;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    button.option {
      border: none;
      padding: 18px 14px;
      border-radius: 20px;
      font-size: 21px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.16);
    }

    button.option:nth-child(1) { background: #4dabf7; }
    button.option:nth-child(2) { background: #ff922b; }
    button.option:nth-child(3) { background: #51cf66; }
    button.option:nth-child(4) { background: #845ef7; }

    button.option:hover {
      transform: translateY(-3px);
      filter: brightness(1.05);
    }

    button.option:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
    }

    button.option.correct {
      background: #2f9e44 !important;
      animation: pop 0.35s ease;
    }

    button.option.wrong {
      background: #e03131 !important;
      animation: shake 0.35s ease;
    }

    button.option:disabled {
      cursor: not-allowed;
      opacity: 0.9;
    }

    .feedback {
      min-height: 38px;
      font-size: 24px;
      font-weight: bold;
      margin: 18px 0;
    }

    .feedback.correct-text { color: #2f9e44; }
    .feedback.wrong-text { color: #e03131; }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .main-btn {
      border: none;
      background: #3b3b98;
      color: white;
      padding: 14px 22px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .main-btn:hover {
      background: #292970;
      transform: scale(1.04);
    }

    .sound-btn {
      background: #ffbe0b;
      color: #333;
    }

    .result-box {
      display: none;
      background: #f8f9ff;
      border-radius: 24px;
      padding: 28px 18px;
      margin-top: 20px;
      border: 3px solid #dbe5ff;
    }

    .result-box h2 {
      font-size: 32px;
      color: #3b3b98;
      margin: 0 0 10px;
    }

    .final-score {
      font-size: 28px;
      color: #222;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .progress-wrap {
      width: 100%;
      height: 18px;
      background: #e9ecef;
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #51cf66, #4dabf7);
      transition: 0.3s;
    }

    .hidden {
      display: none !important;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-7px); }
    }

    @media (max-width: 600px) {
      .container {
        padding: 22px 16px;
      }

      h1, .cover-title {
        font-size: 27px;
      }

      .question {
        font-size: 22px;
      }

      .options {
        grid-template-columns: 1fr;
      }

      button.option {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <section id="coverPage" class="cover-page">
        <div class="cover-icon">📚✨</div>
        <h1 class="cover-title">Mari Mulai Quiz<br>Kosa Kata Bahasa Inggris</h1>
        <p class="teacher-label">👩‍🏫 Nama Guru:</p>
        <div class="teacher-names">Amel • Delima • Tata</div>
        <button class="main-btn" id="startBtn" style="margin-top:30px;font-size:22px;padding:16px 32px;">
          ▶ Mulai Quiz
        </button>
      </section>

      <main id="mainGame" class="hidden">
        <h1>🎮 Game Kosakata Bahasa Inggris</h1>
        <div class="subtitle">Pilih arti Bahasa Inggris yang benar!</div>

        <div class="top-bar">
          <div class="badge">Soal: <span id="questionNumber">1</span>/<span id="totalQuestion">10</span></div>
          <div class="badge">❤️ Kesempatan: <span id="lives">3</span></div>
        </div>

        <div class="progress-wrap">
          <div class="progress" id="progress"></div>
        </div>

        <section id="quizArea">
          <div class="question-box">
            <div class="emoji" id="emoji">🍎</div>
            <div class="question" id="questionText">Apa Bahasa Inggris dari Apel?</div>
          </div>

          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>

          <div class="controls">
            <button class="main-btn" id="nextBtn" style="display:none;">Soal Berikutnya ➜</button>
            <button class="main-btn sound-btn" id="soundBtn">🔊 Suara: ON</button>
          </div>
        </section>

        <section class="result-box" id="resultBox">
          <h2>🎉 Permainan Selesai!</h2>
          <div class="final-score" id="finalScore">Skor Akhir: 0</div>
          <p id="resultMessage" style="font-size:20px;color:#555;"></p>
          <button class="main-btn" id="restartBtn">Main Lagi 🔄</button>
        </section>
      </main>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const questions = [
        { emoji: "🍎", question: "Apa Bahasa Inggris dari Apel?", options: ["Apple", "Orange", "Banana", "Grape"], answer: "Apple" },
        { emoji: "🐱", question: "Apa Bahasa Inggris dari Kucing?", options: ["Dog", "Cat", "Bird", "Fish"], answer: "Cat" },
        { emoji: "📚", question: "Apa Bahasa Inggris dari Buku?", options: ["Pencil", "Bag", "Book", "Chair"], answer: "Book" },
        { emoji: "☀️", question: "Apa Bahasa Inggris dari Matahari?", options: ["Moon", "Star", "Cloud", "Sun"], answer: "Sun" },
        { emoji: "🏠", question: "Apa Bahasa Inggris dari Rumah?", options: ["School", "House", "Garden", "Room"], answer: "House" },
        { emoji: "🐶", question: "Apa Bahasa Inggris dari Anjing?", options: ["Dog", "Cat", "Cow", "Duck"], answer: "Dog" },
        { emoji: "✏️", question: "Apa Bahasa Inggris dari Pensil?", options: ["Pen", "Ruler", "Pencil", "Eraser"], answer: "Pencil" },
        { emoji: "🌙", question: "Apa Bahasa Inggris dari Bulan?", options: ["Sun", "Moon", "Sky", "Rain"], answer: "Moon" },
        { emoji: "🪑", question: "Apa Bahasa Inggris dari Kursi?", options: ["Table", "Chair", "Door", "Window"], answer: "Chair" },
        { emoji: "🐟", question: "Apa Bahasa Inggris dari Ikan?", options: ["Bird", "Fish", "Rabbit", "Horse"], answer: "Fish" }
      ];

      let currentQuestion = 0;
      let score = 0;
      let lives = 3;
      let soundOn = true;
      let answered = false;

      const el = {
        coverPage: document.getElementById("coverPage"),
        mainGame: document.getElementById("mainGame"),
        startBtn: document.getElementById("startBtn"),
        questionNumber: document.getElementById("questionNumber"),
        totalQuestion: document.getElementById("totalQuestion"),
        lives: document.getElementById("lives"),
        progress: document.getElementById("progress"),
        emoji: document.getElementById("emoji"),
        questionText: document.getElementById("questionText"),
        options: document.getElementById("options"),
        feedback: document.getElementById("feedback"),
        nextBtn: document.getElementById("nextBtn"),
        soundBtn: document.getElementById("soundBtn"),
        quizArea: document.getElementById("quizArea"),
        resultBox: document.getElementById("resultBox"),
        finalScore: document.getElementById("finalScore"),
        resultMessage: document.getElementById("resultMessage"),
        restartBtn: document.getElementById("restartBtn")
      };

      function runTests() {
        const requiredIds = [
          "coverPage", "mainGame", "startBtn", "questionNumber", "totalQuestion", "lives",
          "progress", "emoji", "questionText", "options", "feedback", "nextBtn",
          "soundBtn", "quizArea", "resultBox", "finalScore", "resultMessage", "restartBtn"
        ];

        requiredIds.forEach(id => {
          console.assert(document.getElementById(id), `Elemen dengan id ${id} harus ada.`);
        });

        console.assert(questions.length === 10, "Jumlah soal harus 10.");
        console.assert(questions.every(q => q.options.includes(q.answer)), "Setiap jawaban benar harus ada di pilihan.");
        console.assert(!document.getElementById("score"), "Skor tidak boleh muncul saat mengerjakan soal.");
      }

      function playTone(type) {
        if (!soundOn) return;

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const audio = new AudioContextClass();
        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.connect(gain);
        gain.connect(audio.destination);

        if (type === "correct") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(600, audio.currentTime);
          osc.frequency.setValueAtTime(850, audio.currentTime + 0.12);
          osc.frequency.setValueAtTime(1050, audio.currentTime + 0.24);
          gain.gain.setValueAtTime(0.35, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.45);
          osc.start(audio.currentTime);
          osc.stop(audio.currentTime + 0.45);
        } else {
          osc.type = "square";
          osc.frequency.setValueAtTime(220, audio.currentTime);
          osc.frequency.setValueAtTime(150, audio.currentTime + 0.2);
          gain.gain.setValueAtTime(0.22, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.35);
          osc.start(audio.currentTime);
          osc.stop(audio.currentTime + 0.35);
        }
      }

      function speak(text) {
        if (!soundOn || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.8;
        utterance.pitch = 1.2;
        window.speechSynthesis.speak(utterance);
      }

      function loadQuestion() {
        answered = false;

        if (currentQuestion >= questions.length) {
          showResult();
          return;
        }

        const q = questions[currentQuestion];

        el.questionNumber.textContent = currentQuestion + 1;
        el.totalQuestion.textContent = questions.length;
        el.lives.textContent = lives;
        el.emoji.textContent = q.emoji;
        el.questionText.textContent = q.question;
        el.feedback.textContent = "";
        el.feedback.className = "feedback";
        el.nextBtn.style.display = "none";
        el.options.innerHTML = "";
        el.progress.style.width = `${(currentQuestion / questions.length) * 100}%`;

        q.options.forEach(option => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.type = "button";
          btn.textContent = option;
          btn.addEventListener("click", () => checkAnswer(btn, option));
          el.options.appendChild(btn);
        });
      }

      function checkAnswer(button, selected) {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestion];
        const optionButtons = el.options.querySelectorAll(".option");
        optionButtons.forEach(btn => btn.disabled = true);

        if (selected === q.answer) {
          score += 10;
          button.classList.add("correct");
          el.feedback.textContent = "Hebat! Jawaban kamu benar 🎉";
          el.feedback.classList.add("correct-text");
          playTone("correct");
          speak(q.answer);
        } else {
          lives--;
          el.lives.textContent = lives;
          button.classList.add("wrong");
          el.feedback.textContent = "Ups, jawaban belum tepat. Coba semangat lagi!";
          el.feedback.classList.add("wrong-text");
          playTone("wrong");
        }

        setTimeout(() => {
          if (lives <= 0) {
            showResult();
          } else {
            el.nextBtn.style.display = "inline-block";
          }
        }, 700);
      }

      function nextQuestion() {
        currentQuestion++;

        if (currentQuestion >= questions.length || lives <= 0) {
          showResult();
          return;
        }

        loadQuestion();
      }

      function showResult() {
        el.progress.style.width = "100%";
        el.quizArea.style.display = "none";
        el.resultBox.style.display = "block";
        el.finalScore.textContent = `Skor Akhir: ${score} dari ${questions.length * 10}`;

        if (score >= 80) {
          el.resultMessage.textContent = "Luar biasa! Kamu sangat pintar belajar kosakata Bahasa Inggris! 🌟";
        } else if (score >= 50) {
          el.resultMessage.textContent = "Bagus! Terus latihan agar semakin lancar Bahasa Inggris! 😊";
        } else {
          el.resultMessage.textContent = "Tidak apa-apa, ayo belajar lagi dan coba ulang permainannya! 💪";
        }
      }

      function restartGame() {
        currentQuestion = 0;
        score = 0;
        lives = 3;
        answered = false;
        el.quizArea.style.display = "block";
        el.resultBox.style.display = "none";
        loadQuestion();
      }

      function toggleSound() {
        soundOn = !soundOn;
        el.soundBtn.textContent = soundOn ? "🔊 Suara: ON" : "🔇 Suara: OFF";
      }

      function startQuiz() {
        el.coverPage.classList.add("hidden");
        el.mainGame.classList.remove("hidden");
        restartGame();
      }

      el.startBtn.addEventListener("click", startQuiz);
      el.nextBtn.addEventListener("click", nextQuestion);
      el.soundBtn.addEventListener("click", toggleSound);
      el.restartBtn.addEventListener("click", restartGame);

      el.totalQuestion.textContent = questions.length;
      runTests();
    });
  </script>
</body>
</html>
